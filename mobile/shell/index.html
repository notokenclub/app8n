<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>app8n</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #0a0a0a;
        color: #ededed;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: #a1a1a1;
        line-height: 1.5;
        max-width: 32ch;
      }
      code {
        background: #1a1a1a;
        padding: 0.15rem 0.4rem;
        border-radius: 4px;
        font-size: 0.85em;
      }
      button {
        background: #ededed;
        color: #0a0a0a;
        border: 0;
        border-radius: 999px;
        padding: 0.75rem 1.75rem;
        font-size: 1rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Can't reach your app8n backend</h1>
      <p>
        The app connects to a backend you run. Check that it is online and
        reachable from this device, then try again.
      </p>
      <button onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
