# app8n — the web backend and the scheduler, from one image.
#
# The worker is a separate service rather than a thread inside the server
# because schedules must keep firing when nobody has the app open, and because
# a restart of the web process should not drop a run in flight.

services:
  app:
    build: .
    image: app8n:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      # Both services share one SQLite file on the volume below.
      DATABASE_URL: file:./data/app8n.db
    volumes:
      - app8n-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build: .
    image: app8n:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: file:./data/app8n.db
    volumes:
      - app8n-data:/app/data
    command: ["node", "dist/worker.cjs"]
    depends_on:
      app:
        condition: service_healthy

volumes:
  app8n-data:
